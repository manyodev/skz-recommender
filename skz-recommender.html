<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKZ Recommender</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .mood-btn {
        padding: 10px 20px;
        margin-right: 10px;
        cursor: pointer;
      }
      #result {
        margin-top: 30px;
        display: none;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      #album-art {
        max-width: 200px;
        display: block;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Find Your Song</h1>
    <p>Select your current vibe:</p>

    <button class="mood-btn" onclick="getRecommendation('happy')">
      ☀️ Happy
    </button>
    <button class="mood-btn" onclick="getRecommendation('sad')">🌧️ Sad</button>

    <div id="result">
      <img id="album-art" src="" alt="Album Art" />
      <h2 id="song-title"></h2>
      <p id="song-artist"></p>
      <a id="genius-link" href="#" target="_blank">View Lyrics on Genius</a>
    </div>

    <script>
      // Replace this with your actual Genius Client Access Token
      // For production on GitHub Pages, consider using a token prompt or simple config file
      const GENIUS_TOKEN =
        "gS3280cJJaAfqX0tjJvv_ahf02FSeoQZADtIahNs0MlgAxdvioiwF7ERT0KXkpe_";

      // Map your frontend options to specific Genius Song IDs
      // You can find a song's ID by searching the track on the Genius website
      const songDatabase = {
        happy: "2434417", // Example: "Happy" by Pharrell Williams ID
        sad: "10558052", // Example: "Someone Like You" by Adele ID
      };

      async function getRecommendation(mood) {
        const songId = songDatabase[mood];
        if (!songId) return;

        try {
          // Fetch directly from the Genius API song endpoint
          const response = await fetch(
            `https://genius.com/api/v1/songs/${songId}`,
            {
              headers: {
                Authorization: `Bearer ${GENIUS_TOKEN}`,
              },
            },
          );

          const data = await response.json();
          const song = data.response.song;

          // Update the DOM with UI results
          document.getElementById("song-title").innerText = song.title;
          document.getElementById("song-artist").innerText =
            song.primary_artist.name;
          document.getElementById("album-art").src =
            song.song_art_image_thumbnail_url;
          document.getElementById("genius-link").href = song.url;

          // Show the container
          document.getElementById("result").style.display = "block";
        } catch (error) {
          console.error("Error fetching data from Genius:", error);
          alert("Oops! Something went wrong retrieving the song.");
        }
      }
    </script>
  </body>
</html>
