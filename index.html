<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKZ Song Recommender</title>
    <link rel="stylesheet" href="skz-recommender.css" />
  </head>
  <body>
    <h2>Stray Kids Song Recommender</h2>
    <p id="status">Loading the local song catalog...</p>

    <!-- Dropdown Form -->
    <form id="recommenderForm">
      <label for="genreSelect">Choose a Genre:</label><br />
      <select id="genreSelect">
        <option value="Acoustic">Acoustic</option>
        <option value="Ballad">Ballad</option>
        <option value="EDM">EDM</option>
        <option value="Funk">Funk</option>
        <option value="Hip-Hop">Hip-Hop</option>
        <option value="Metal">Metal</option>
        <option value="Pop">Pop</option>
        <option value="Pop-R&B">Pop-R&amp;B</option>
        <option value="Pop-Rock">Pop-Rock</option>
        <option value="R&B">R&amp;B</option>
        <option value="Rock">Rock</option>
      </select>
      <br />
      <label for="mvSelect">Music Video Preference:</label><br />
      <select id="mvSelect">
        <option value="yes no">No Preference</option>
        <option value="yes">Has a Music Video</option>
        <option value="no">Only Audio</option>
      </select>
      <br />
      <button type="submit">Get Recommendation</button>
    </form>

    <!-- Result Display Room -->
    <div id="result"></div>
    <footer> Song Previews from iTunes via iTunes API</footer>
    <script src="skz-recommender.js"></script>
  </body>
</html>
